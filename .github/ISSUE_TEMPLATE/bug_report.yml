name: 🐛 버그 리포트
description: 버그를 보고하여 프로젝트 개선에 도움을 주세요
title: "[버그]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        이슈를 제출해 주셔서 감사합니다. 아래 양식을 작성해 주세요.

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 버그에 대한 명확하고 간결한 설명을 해주세요.
      placeholder: 어떤 문제가 발생했는지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 버그를 재현하기 위한 단계를 설명해 주세요.
      placeholder: |
        1. '...'로 이동
        2. '...'를 클릭
        3. '...'까지 스크롤
        4. 오류 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 예상했던 동작을 명확하고 간결하게 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷
      description: 해당되는 경우 문제를 설명하는 데 도움이 되는 스크린샷을 추가해 주세요.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 환경 정보
      description: 운영체제, 브라우저 등 환경 정보를 알려주세요.
      placeholder: |
        - 운영체제: [예: Windows 11, macOS 15]
        - 브라우저: [예: Chrome 120, Safari 18]
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 버그에 대한 추가 정보를 입력해 주세요.
    validations:
      required: false
